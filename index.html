<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
     <header>
        <h1>Despensa Virtual</h1>
        <p>Organize seus ingredientes de forma simples e segura.</p>
    </header>

    <main>

        <!-- CADASTRO DO CLIENTE -->
        <section class="card">
            <h2>Cadastro do Cliente</h2>

            <form id="cadastroForm">

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        minlength="6"
                        required
                    >
                </div>

                <div class="lgpd">
                    <input type="checkbox" id="lgpd" required>

                    <label for="lgpd">
                        Concordo com o tratamento dos meus dados
                        conforme a LGPD.
                    </label>
                </div>

                <button type="submit">
                    Cadastrar
                </button>

            </form>

            <p id="mensagemCadastro"></p>
        </section>


        <!-- DESPENSA -->
        <section class="card">

            <h2>Minha Despensa</h2>

            <form id="ingredienteForm">

                <div class="campo">
                    <label for="ingrediente">Ingrediente</label>

                    <input
                        type="text"
                        id="ingrediente"
                        placeholder="Ex: Arroz"
                        required
                    >
                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="quantidade">Quantidade</label>

                        <input
                            type="number"
                            id="quantidade"
                            min="1"
                            placeholder="Ex: 2"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="unidade">Unidade</label>

                        <select id="unidade">
                            <option value="unidade">Unidade</option>
                            <option value="kg">Kg</option>
                            <option value="g">Gramas</option>
                            <option value="l">Litros</option>
                            <option value="ml">Ml</option>
                        </select>
                    </div>

                </div>


                <div class="linha">

                    <div class="campo">
                        <label for="categoria">Categoria</label>

                        <select id="categoria">

                            <option value="Grãos">
                                Grãos
                            </option>

                            <option value="Frutas">
                                Frutas
                            </option>

                            <option value="Verduras">
                                Verduras
                            </option>

                            <option value="Carnes">
                                Carnes
                            </option>

                            <option value="Laticínios">
                                Laticínios
                            </option>

                            <option value="Bebidas">
                                Bebidas
                            </option>

                            <option value="Outros">
                                Outros
                            </option>

                        </select>
                    </div>


                    <div class="campo">
                        <label for="local">Local</label>

                        <select id="local">

                            <option value="Geladeira">
                                Geladeira
                            </option>

                            <option value="Despensa">
                                Despensa
                            </option>

                            <option value="Freezer">
                                Freezer
                            </option>

                        </select>
                    </div>

                </div>


                <div class="campo">

                    <label for="validade">
                        Data de validade
                    </label>

                    <input
                        type="date"
                        id="validade"
                    >

                </div>


                <button type="submit">
                    Adicionar ingrediente
                </button>

            </form>

        </section>


        <!-- LISTA DE INGREDIENTES -->
        <section class="card">

            <div class="titulo-lista">

                <h2>
                    Ingredientes cadastrados
                </h2>

                <button
                    type="button"
                    id="limparLista"
                    class="btn-danger"
                >
                    Limpar lista
                </button>

            </div>


            <div id="listaIngredientes">

                <p class="vazio">
                    Nenhum ingrediente cadastrado.
                </p>

            </div>

        </section>

    </main>


    <footer>
        <p>
            © 2026 - Despensa Virtual
        </p>
    </footer>
    <script src="/js/script.js"></script>
</body>
</html>
